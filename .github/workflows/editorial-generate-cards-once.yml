name: Generate editorial cards (one-off)

on:
  push:
    branches:
      - editorial/20261117-priority-4-event-guides

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/editorial/20261117-priority-4-event-guides'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Generate exact deterministic site card assets
        env:
          GITHUB_ACTIONS: 'false'
        run: npm run og:cards
      - name: Commit generated assets back to this editorial branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/card src/data/card-images.ts src/assets/og/ibaraki-backdrop.png
          if git diff --cached --quiet; then
            echo "Card assets already match repository."
            exit 0
          fi
          git commit -m "chore(cards): commit generated editorial cards for four event guides"
          git push origin "HEAD:editorial/20261117-priority-4-event-guides"
