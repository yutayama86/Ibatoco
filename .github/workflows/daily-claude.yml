name: Daily Claude implementation

# 毎朝 ChatGPT（Growth Director）が書いた指示書を検査し、合格したときだけ Claude Code が
# 最大3件を実装して Draft PR にする。マージ・本番公開はしない（オーナー承認後に ChatGPT が行う）。
#   gate（検査）→ implement（Claude。コマンド実行なし・書き込み範囲限定）→ verify（認証情報なしで検証）→ pr（Claude なしで Draft PR）
# 仕様：docs/automation/daily-claude/README.md
on:
  schedule:
    - cron: '15 22 * * *' # 毎日 07:15 JST。GitHub の schedule は遅れることがあるため、指示書の完成を必須条件にする
  workflow_dispatch:
    inputs:
      date:
        description: '指示書の日付（YYYY-MM-DD・日本時間）。空なら今日'
        required: false
        default: ''
      dry_run:
        description: 'true なら検査と計画だけ（Claude を動かさず、PR も作らない）'
        type: boolean
        default: true
  # 自動実装の仕組み・実装キュー・仕様を変える PR では、Actions 上で Dry Run だけを行う（Claude は動かさない）
  pull_request:
    paths:
      - '.github/workflows/daily-claude.yml'
      - 'scripts/daily-brief.mjs'
      - 'scripts/daily-brief.test.mjs'
      - 'docs/automation/daily-claude/**'
      - 'data/editorial/action-queue.json'
      - 'docs/editorial/specs/**'

permissions: {}

concurrency:
  group: daily-claude-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  BRIEF_REF: automation/daily-briefs
  BRIEF_DIR: docs/automation/daily-claude

jobs:
  gate:
    name: Check the brief
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # 環境 daily-claude の保護設定を読むため
    outputs:
      run: ${{ steps.gate.outputs.run }}
      date: ${{ steps.gate.outputs.date }}
      branch: ${{ steps.gate.outputs.branch }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm

      - run: npm ci

      - name: Fetch the brief (data only, never executed)
        id: brief
        env:
          INPUT_DATE: ${{ inputs.date }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          DATE="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::日付の形式が不正です"; exit 1; }
          mkdir -p "$RUNNER_TEMP/brief"
          found=false
          if git fetch --no-tags "https://github.com/${REPO}.git" "refs/heads/${BRIEF_REF}:refs/remotes/brief" >/dev/null 2>&1 \
            && git show "refs/remotes/brief:${BRIEF_DIR}/${DATE}.md" > "$RUNNER_TEMP/brief/brief.md" 2>/dev/null; then
            found=true
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Gate
        id: gate
        env:
          DATE: ${{ steps.brief.outputs.date }}
          FOUND: ${{ steps.brief.outputs.found }}
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry-run' || 'live' }}
          ENABLED: ${{ vars.DAILY_CLAUDE_ENABLED == 'true' }}
          EXTRA_USAGE_OFF: ${{ vars.DAILY_CLAUDE_EXTRA_USAGE_OFF == 'true' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="claude/daily-${DATE}"
          BASE="$(git rev-parse HEAD)"
          OUT="$RUNNER_TEMP/brief"
          run=false
          stop() { echo "::notice::$1"; echo "- 結果: **停止**（$1）" >> "$GITHUB_STEP_SUMMARY"; }
          # Claude の認証を置く環境 daily-claude に、使えるブランチの制限（main だけ）があるか
          env_protected() { local v; v="$(gh api "repos/${REPO}/environments/daily-claude" --jq '.deployment_branch_policy != null' 2>/dev/null)" || return 1; [ "$v" = "true" ]; }
          {
            echo "## 毎朝の自動実装（${DATE}・${MODE}）"
            echo "- 検査した main: \`${BASE}\`"
            echo "- 指示書: \`${BRIEF_DIR}/${DATE}.md\`（ブランチ \`${BRIEF_REF}\`）"
          } >> "$GITHUB_STEP_SUMMARY"
          # 有効化の準備状況（オーナーの設定の確認用。Secret の有無はこのジョブからは見えない）
          {
            echo "- 有効化の準備状況："
            if env_protected; then echo "  - 環境 daily-claude：main だけで使える設定あり"; else echo "  - 環境 daily-claude：未設定（または使えるブランチの制限なし）"; fi
            echo "  - 変数 DAILY_CLAUDE_EXTRA_USAGE_OFF：$([ "$EXTRA_USAGE_OFF" = "true" ] && echo 登録済み（true） || echo 未登録)"
            echo "  - 変数 DAILY_CLAUDE_ENABLED：$([ "$ENABLED" = "true" ] && echo 有効（true） || echo 無効)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FOUND" != "true" ]; then
            stop "指示書がありません"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            stop "同じ日のブランチ ${BRANCH} があります（重複防止）"
          elif ! node scripts/daily-brief.mjs prepare "$OUT/brief.md" --name "${DATE}.md" --date "$DATE" --main "$BASE" --out "$OUT" > "$OUT/validate.txt" 2>&1; then
            cat "$OUT/validate.txt"
            { echo "- 結果: **停止**（指示書の検査に不合格）"; echo '```'; cat "$OUT/validate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # 定期実行では失敗として通知する。PR の Dry Run では、その日の指示書の状態で PR を落とさない
            if [ "$MODE" != "pr" ]; then echo "::error::指示書の検査に通らないため停止します"; exit 1; fi
          else
            cat "$OUT/validate.txt"
            { echo '```'; cat "$OUT/validate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$MODE" != "live" ]; then
              echo "- 結果: **Dry Run**（検査は通過。Claude は動かさない）" >> "$GITHUB_STEP_SUMMARY"
              { echo '<details><summary>Claude に渡す指示文</summary>'; echo; cat "$OUT/prompt.md"; echo; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$ENABLED" != "true" ]; then
              stop "自動実装が無効です（変数 DAILY_CLAUDE_ENABLED）"
            elif [ "$EXTRA_USAGE_OFF" != "true" ]; then
              stop "追加利用（extra usage）がオフであることの確認が未登録です（変数 DAILY_CLAUDE_EXTRA_USAGE_OFF）"
            elif ! env_protected; then
              stop "環境 daily-claude（main だけで使える設定）がありません"
            else
              run=true
              echo "- 結果: **実装へ進む**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Implementation queue readiness
        env:
          DATE: ${{ steps.brief.outputs.date }}
        run: node scripts/daily-brief.mjs candidates --date "$DATE" | tee -a "$GITHUB_STEP_SUMMARY"

      # PR の Dry Run だけ：実在しない案件で、通る指示書と止まる指示書を検査し、仕組みそのものが動くことを確かめる
      - name: Self-test with fixtures (PR only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/selftest"; mkdir -p "$T"
          DATE="$(TZ=Asia/Tokyo date +%F)"; YDAY="$(TZ=Asia/Tokyo date -d '1 day ago' +%F)"
          NOW="$(TZ=Asia/Tokyo date +%FT%T+09:00)"; BASE="$(git rev-parse HEAD)"
          printf '%s' '{ "actions": [ { "id": "selftest-1", "title": "自己診断（実在しない案件）", "kind": "update", "status": "ready",
            "targetFile": "src/content/events/daily-claude-selftest.md", "specPath": "docs/automation/daily-claude/TEMPLATE.md",
            "primarySourceUrls": ["https://example.invalid/"], "acceptanceCriteria": ["自己診断"] } ] }' > "$T/queue.json"
          mk() { printf -- '---\nschema: ibatoco-daily-claude/v1\ndate: "%s"\nstatus: %s\ngenerated_by: chatgpt-growth-director\ngenerated_at: "%s"\nbase_main_sha: "%s"\ntasks:\n  - action_id: "selftest-1"\n    expected_pv: "+0"\n---\n%s\n' "$1" "$2" "$3" "$BASE" "$4" > "$T/${DATE}.md"; }
          failed=0
          check() { # check <期待 pass|fail> <説明>
            if node scripts/daily-brief.mjs prepare "$T/${DATE}.md" --date "$DATE" --main "$BASE" --queue "$T/queue.json" --out "$T/out" > "$T/log.txt" 2>&1; then got=pass; else got=fail; fi
            echo "- ${2}：期待 ${1} → ${got}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" != "$1" ]; then cat "$T/log.txt"; failed=1; fi
          }
          echo "### 自己診断（PR の Dry Run）" >> "$GITHUB_STEP_SUMMARY"
          mk "$DATE" ready "$NOW" "補足"; check pass "完成した当日の指示書は通る"
          grep -q '変えられない規則' "$T/out/prompt.md" || { echo "::error::指示文が作られていません"; failed=1; }
          mk "$DATE" draft "$NOW" "書きかけ"; check fail "書きかけ（status: draft）は止まる"
          mk "$YDAY" ready "${YDAY}T07:00:00+09:00" "前日"; check fail "前日の指示書は止まる"
          mk "$DATE" ready "$NOW" $'```bash\nnpm run deploy\n```'; check fail "コマンド入りの指示書は止まる"
          printf 'diff --git a/scripts/x.mjs b/scripts/x.mjs\nnew file mode 100644\nindex 0000000..e69de29\n' > "$T/bad.patch"
          if node scripts/daily-brief.mjs check-patch "$T/bad.patch" > "$T/log.txt" 2>&1; then echo "- scripts を変えるパッチ：期待 fail → pass" >> "$GITHUB_STEP_SUMMARY"; failed=1; else echo "- scripts を変えるパッチは適用前に止まる：期待 fail → fail" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$failed"

      - name: Keep the validated brief
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-claude-brief-${{ github.run_id }}
          path: ${{ runner.temp }}/brief/
          retention-days: 14

  implement:
    name: Implement with Claude (no commands, scoped writes)
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Claude の認証は環境 daily-claude の Secret に置き、main だけで使えるようにする（README の手順）
    environment: daily-claude
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daily-claude-brief-${{ github.run_id }}
          path: ${{ runner.temp }}/brief

      - name: Load the prompt
        id: prompt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "text<<PROMPT_EOF_${GITHUB_RUN_ID}"
            cat "$RUNNER_TEMP/brief/prompt.md"
            echo "PROMPT_EOF_${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      # Claude はファイルを読み、許可した範囲にだけ書く。Bash・Web は使えない（verify・カード生成は次のジョブ）
      - name: Claude Code
        # v1.0.250（2026-10-14）。公開直後の版は避け、上げるときは別PRで差分を確認する
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit(src/content/events/**),Edit(src/content/news/**),Edit(src/data/seo-changes.ts),Edit(src/data/sports/matches/**),Edit(data/editorial/event-registry.json),Edit(data/editorial/action-queue.json),Edit(reports/daily-claude/**)"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Task,Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(//tmp/**),Read(//home/runner/work/_temp/**),Read(~/.claude/**),Read(~/.config/**),Read(~/.npmrc),Read(~/.gitconfig)"

      - name: Check the change scope
        env:
          BASE: ${{ needs.gate.outputs.base }}
        run: node scripts/daily-brief.mjs check-diff --base "$BASE"

      - name: Export the change
        env:
          BASE: ${{ needs.gate.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          git add -A
          git diff --cached --binary --no-renames "$BASE" > "$RUNNER_TEMP/out/change.patch"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-claude-change-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  # 認証情報を持たない新しい環境で、Claude の変更を検証する（Claude の書いた内容が、認証情報のあるジョブで実行されないように）
  verify:
    name: Verify the change (no secrets)
    needs: [gate, implement]
    if: needs.gate.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daily-claude-brief-${{ github.run_id }}
          path: ${{ runner.temp }}/brief

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daily-claude-change-${{ github.run_id }}
          path: ${{ runner.temp }}/in

      - name: Apply the change (checked before applying)
        run: |
          node scripts/daily-brief.mjs check-patch "$RUNNER_TEMP/in/change.patch"
          git apply --index "$RUNNER_TEMP/in/change.patch"

      - name: Sync the event registry (only when an event article is added)
        env:
          BASE: ${{ needs.gate.outputs.base }}
        shell: bash
        run: |
          if git diff --cached --name-only --diff-filter=A "$BASE" -- src/content/events/ | grep -q .; then npm run editorial:sync; else echo "新しいイベント記事なし"; fi

      - name: Observation window guard
        env:
          BASE: ${{ needs.gate.outputs.base }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "毎朝の自動実装（検査用・push しない）"
          node scripts/observation-guard.mjs --base "$BASE" --head HEAD --body-file "$RUNNER_TEMP/brief/exceptions.txt"

      - name: Verify
        run: npm run verify

      - name: Re-check the change scope after verify
        env:
          BASE: ${{ needs.gate.outputs.base }}
        run: node scripts/daily-brief.mjs check-diff --base "$BASE"

      - name: Export the verified change
        env:
          BASE: ${{ needs.gate.outputs.base }}
          DATE: ${{ needs.gate.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          git add -A
          git diff --cached --binary --no-renames "$BASE" > "$RUNNER_TEMP/out/change.patch"
          if [ -f "reports/daily-claude/${DATE}.md" ]; then cp "reports/daily-claude/${DATE}.md" "$RUNNER_TEMP/out/report.md"; else echo "（Claude の報告がありません）" > "$RUNNER_TEMP/out/report.md"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-claude-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  pr:
    name: Open a Draft PR (no Claude, no merge)
    needs: [gate, verify]
    if: needs.gate.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write # 必須チェック（Validate site・CodeQL）を起動するため
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.base }}

      # 書き込み権限のあるジョブでは依存関係を入れない（検査スクリプトは Node 標準だけで動く）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daily-claude-brief-${{ github.run_id }}
          path: ${{ runner.temp }}/brief

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daily-claude-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/out

      - name: Apply, re-check, push and open the Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.gate.outputs.base }}
          DATE: ${{ needs.gate.outputs.date }}
          BRANCH: ${{ needs.gate.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^claude/daily-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::ブランチ名が不正です"; exit 1; }
          node scripts/daily-brief.mjs check-patch "$RUNNER_TEMP/out/change.patch"
          git apply --index "$RUNNER_TEMP/out/change.patch"
          node scripts/daily-brief.mjs check-diff --base "$BASE" --staged
          git switch -c "$BRANCH"
          # 観測窓の例外（main でレビュー済みの宣言だけ）をコミットにも残す。あとで人が push しても観測窓ガードが同じ判断をする
          msg=(-m "content: 毎朝の自動実装（${DATE}）" -m "指示書 ${BRIEF_DIR}/${DATE}.md（${BRIEF_REF}）を Claude Code が実装。Draft PR。マージはオーナー承認後。")
          if [ -s "$RUNNER_TEMP/brief/exceptions.txt" ]; then msg+=(-m "$(cat "$RUNNER_TEMP/brief/exceptions.txt")"); fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q "${msg[@]}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          {
            echo "毎朝の自動実装（${DATE}）。**Draft・マージしない**。公開はオーナーが明示的に「公開」と承認した場合だけ、ChatGPT が最新状態を再確認してマージする。"
            echo
            echo "## 案件（指示書より）"
            grep -E '^  - ' "$RUNNER_TEMP/brief/tasks.txt" || echo "（一覧なし）"
            if [ -s "$RUNNER_TEMP/brief/exceptions.txt" ]; then echo; echo "## 観測窓の例外（main の実装キューで宣言済み）"; cat "$RUNNER_TEMP/brief/exceptions.txt"; fi
            echo
            echo "## Claude の報告"
            cat "$RUNNER_TEMP/out/report.md"
            echo
            echo "---"
            echo "- 指示書: \`${BRIEF_DIR}/${DATE}.md\`（ブランチ \`${BRIEF_REF}\`）"
            echo "- 実行: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- ワークフロー内で通過済み：変更範囲の検査（Claude の直後・適用前・verify 後）、観測窓ガード、npm run verify。Validate site と CodeQL はこのあと起動する"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --draft --base main --head "$BRANCH" --title "【自動・Draft】毎朝の記事改善（${DATE}）" --body-file "$RUNNER_TEMP/body.md"
          # GITHUB_TOKEN で作った PR では pull_request のワークフローが起動しないため、必須チェックを明示的に起動する
          gh workflow run validate.yml --ref "$BRANCH"
          gh workflow run codeql.yml --ref "$BRANCH"
