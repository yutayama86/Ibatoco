name: Temporary compare generated card manifest
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: |
          env -u GITHUB_ACTIONS npm run og:cards
          git diff -- src/data/card-images.ts
