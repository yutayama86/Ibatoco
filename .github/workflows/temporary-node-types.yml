name: Temporary Node types lockfile fix
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-node-types.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Add Node.js type declarations
        run: |
          npm install -D @types/node@^22
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Commit package and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore Node built-in module declarations'
            git push origin HEAD:${{ github.head_ref }}
          fi
