name: Dependency security audit

on:
  schedule:
    # Monday 06:30 JST (Sunday 21:30 UTC)
    - cron: '30 21 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/dependency-audit.mjs'
      - 'scripts/dependency-audit.test.mjs'
      - 'src/lib/dependency-audit.mjs'
      - 'data/security/picomatch-risk-review.json'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
          cache: npm
      - name: Audit production dependencies (high and critical)
        run: node --test scripts/dependency-audit.test.mjs && node scripts/dependency-audit.mjs
      - name: Audit all dependencies (critical)
        if: success()
        run: npm audit --audit-level=critical
      - name: Preserve original dependency audit
        if: always() && hashFiles('reports/security/dependency-audit.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-check-${{ github.run_id }}
          path: reports/security/dependency-audit.json
          retention-days: 7
