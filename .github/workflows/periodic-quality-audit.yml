name: Periodic quality audit (Issue 569)
on:
  schedule:
    - cron: '15 22 * * 6' # Sunday 07:15 JST
    - cron: '20 22 1 * *' # Every month on day 2 at 07:20 JST
  workflow_dispatch:
    inputs:
      mode:
        description: Audit mode
        type: choice
        options: [weekly, monthly]
        default: weekly
permissions:
  contents: read
concurrency:
  group: periodic-quality-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Read-only sample production audit
        env:
          SELECTED_MODE: ${{ github.event.inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SELECTED_MODE" = "monthly" ] || [ "$EVENT_SCHEDULE" = "20 22 1 * *" ]; then
            node scripts/periodic-quality-audit.mjs --monthly
          else
            node scripts/periodic-quality-audit.mjs --weekly
          fi
