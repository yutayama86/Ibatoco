name: Temporary generate event card assets
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Generate cards and emit PR asset data
        shell: bash
        run: |
          npm run og:cards
          for slug in mirai-music-fes-2026 hitachi-kenki-festival-hitachinaka-2026; do
            file=$(find public/images/card -maxdepth 1 -name "${slug}-*.png" | head -n 1)
            echo "ASSET_BEGIN ${file}"
            base64 -w0 "${file}"
            echo
            echo "ASSET_END ${file}"
          done
          echo "MAPPING_BEGIN"
          grep -E 'mirai-music-fes-2026|hitachi-kenki-festival-hitachinaka-2026' src/data/card-images.ts
          echo "MAPPING_END"
