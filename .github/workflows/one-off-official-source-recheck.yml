name: One-off verify 55 source updates

on:
  push:
    branches: [quality/20261117-live-event-qa-watch]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - name: Official source recheck (read-only)
        shell: bash
        run: |
          set +e
          node scripts/official-source-watch.mjs --write > /tmp/watch.log 2>&1
          status=$?
          set -e
          echo "Scan exit code: $status (nonzero means not all sources fetched)"
          if [ ! -s reports/editorial/official-source-watch.json ]; then
            cat /tmp/watch.log
            echo "::error::Source watcher failed before writing a report."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('reports/editorial/official-source-watch.json','utf8'));
          const failed=r.results.filter(x=>x.status!=='fetched');
          const empty=r.results.filter(x=>x.status==='fetched'&&!(x.candidateLinks?.length));
          const items=[
           '### Updated 55-source diagnostic',
           'Attempted '+r.scanned+' / fetched '+r.fetched+' / failed '+r.failed,
           'Broad municipal fetch '+r.municipalityCoverage.citiesWithFetchedBroadSource+'/'+r.municipalityCoverage.totalMunicipalities,
           'Raw unmatched links '+r.unregisteredCandidateCount+' / prioritized '+r.prioritizedCandidateCount+' / direct pages '+r.directSourceCandidateCount,
           'Unfetched: '+failed.map(x=>x.id+'='+x.status+(x.httpStatus?':'+x.httpStatus:'')).join('; '),
           'Fetched, no matching candidate links: '+empty.map(x=>x.id).join(', '),
           'Top 20 prioritized (NOT verified):',
           ...r.unregisteredCandidateLinks.slice(0,20).map(x=>'- ['+x.priority.score+'] '+x.sourceId+': '+x.title+' | '+x.url)
          ];
          console.log(items.join('\n'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,items.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-off-updated-55-source-scan
          path: reports/editorial/official-source-watch.json
          retention-days: 7
