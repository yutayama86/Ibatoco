name: Cloudflare candidate credential preflight
on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-token-candidate.yml'
permissions:
  contents: read
jobs:
  verify-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify candidate token without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CANDIDATE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN_CANDIDATE"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def get(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, headers={"Authorization":"Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  # Never log Cloudflare response bodies: they could contain sensitive metadata
                  raise RuntimeError("Cloudflare API request failed with HTTP " + str(error.code))
          identity = get("/user/tokens/verify")
          if not identity.get("success") or identity.get("result",{}).get("status") != "active":
              raise RuntimeError("Candidate token is not active")
          print("Candidate token is active")
          scripts = get("/accounts/" + account_id + "/workers/scripts")
          if not scripts.get("success"):
              raise RuntimeError("Candidate token cannot list Workers scripts")
          print("Candidate token can access Workers script API; no deployment performed")
          PY

# Re-run preflight after candidate secret registration; no production changes.
      - name: Verify isolated Workers deploy and delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CANDIDATE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          name="ibatoco-token-probe-${GITHUB_RUN_ID}"
          mkdir -p /tmp/ibatoco-token-probe
          printf 'export default {fetch(){return new Response("ok")}};\n' > /tmp/ibatoco-token-probe/index.js
          cat > /tmp/ibatoco-token-probe/wrangler.jsonc <<EOF
          {"name":"$name","main":"index.js","compatibility_date":"2024-11-01","workers_dev":false}
          EOF
          cd /tmp/ibatoco-token-probe
          # Clean up using Workers Scripts API directly. Wrangler delete can require KV permissions.
          cleanup() {
            python3 - <<'PY'
          import os, urllib.request, urllib.error
          aid=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          names=["ibatoco-token-probe-39798405627","ibatoco-token-probe-"+os.environ["GITHUB_RUN_ID"]]
          for name in set(names):
              url="https://api.cloudflare.com/client/v4/accounts/"+aid+"/workers/scripts/"+name
              req=urllib.request.Request(url,method="DELETE",headers={"Authorization":"Bearer "+token})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      print("Worker deleted:",name,"HTTP",response.status)
              except urllib.error.HTTPError as e:
                  if e.code == 404: print("Worker already absent:",name)
                  else: raise RuntimeError("Worker removal failed: "+name+" HTTP "+str(e.code))
          PY
          }
          trap cleanup EXIT
                    echo "Isolated Worker deployment succeeded; production Worker was not touched."
