name: Deploy production

on:
  workflow_run:
    workflows: ["Validate site"]
    types: [completed]
  workflow_dispatch:
  # GITHUB_TOKEN scheduled metric commits do not fire downstream push workflows.
  schedule:
    - cron: '30 21 * * *' # 06:30 JST, after 05:30 metric sync

concurrency:
  group: production-deploy
  # 条件不一致でskipされる後発workflow_runが、有効な本番Deployを巻き添えでcancelしないようにする
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve commit
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject superseded deployment
        shell: bash
        env:
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$TARGET_SHA" != "$latest_sha" ]; then
            echo "::notice::Superseded deployment skipped: target $TARGET_SHA, latest main $latest_sha"
            exit 1
          fi
          echo "Target matches latest main: $TARGET_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Require current-day verified metrics for scheduled deployment
        if: github.event_name == 'schedule'
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const s=JSON.parse(readFileSync("data/editorial/performance-snapshot.json","utf8"));
            const age=Date.now()-Date.parse(s.source?.lastConfirmedAt??0);
            if(s.source?.status!=="google-api-daily-confirmed" || !Number.isFinite(age) || age<0 || age>3*3600000)
              throw new Error("Verified daily metric sync has not completed recently; scheduled deploy blocked");
          '
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - run: npm ci

      - name: Check latest main before deployment
        shell: bash
        env:
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$TARGET_SHA" != "$latest_sha" ]; then
            echo "::error::Main advanced during build; refusing stale deployment: $TARGET_SHA != $latest_sha"
            exit 1
          fi

      - name: Audit and deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
        run: npm run deploy

      - name: Confirm deployed SHA and current main
        shell: bash
        env:
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$TARGET_SHA" != "$latest_sha" ]; then
            echo "::error::Main advanced during deployment: published target $TARGET_SHA; current main $latest_sha. A newer deploy must run."
            exit 1
          fi
          live_sha="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://ibatoco.jp/build.json?verify=$GITHUB_RUN_ID" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).commit")"
          if [ "$live_sha" != "$TARGET_SHA" ]; then
            echo "::error::Production SHA mismatch: live $live_sha, expected $TARGET_SHA"
            exit 1
          fi
          echo "Production SHA verified: $live_sha"

      - name: Verify production
        shell: bash
        run: |
          node scripts/wait-deploy.mjs /events/fukuroda-falls-autumn-2026/ "このあと、どこ行く？" --timeout 300
