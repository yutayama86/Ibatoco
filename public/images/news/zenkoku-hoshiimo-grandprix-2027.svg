<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="全国ほしいもグランプリ2027。1月8日に有楽町で一般審査、1月10日に水戸で表彰。イバトコ作成の図版">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="1"/>
  <text x="80" y="96" font-family="'Source Sans 3', sans-serif" font-size="20" letter-spacing="2.4" fill="#a63f32">IBATOCO ・ 茨城ニュース解説</text>
  <text x="80" y="210" font-family="'Shippori Mincho', serif" font-size="60" font-weight="700" fill="#172b35">全国ほしいもグランプリ</text>
  <text x="84" y="282" font-family="'Source Sans 3', sans-serif" font-size="56" font-weight="700" letter-spacing="4" fill="#315c68">2027</text>
  <rect x="80" y="326" width="320" height="58" fill="#a63f32"/>
  <text x="240" y="365" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="26" font-weight="700" fill="#f6f2e9">1/8 有楽町で一般審査</text>
  <rect x="418" y="326" width="300" height="58" fill="none" stroke="#315c68" stroke-width="2.5"/>
  <text x="568" y="365" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="26" font-weight="700" fill="#315c68">1/10 水戸で表彰</text>
  <text x="80" y="460" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#172b35">出品は1事業者1品、12月10日17時必着</text>
  <text x="80" y="510" font-family="'Source Sans 3', sans-serif" font-size="22" fill="#75695a">1月10日「ほしいもの日」に上位3点を表彰</text>
  <circle cx="860" cy="210" r="30" fill="#a63f32" stroke="#a63f32" stroke-width="3"/>
  <circle cx="940" cy="210" r="25" fill="none" stroke="#a63f32" stroke-width="3"/>
  <circle cx="1020" cy="210" r="20" fill="none" stroke="#a63f32" stroke-width="3"/>
  <text x="1120" y="572" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a">出典：茨城県 ／ 図版：イバトコ</text>
</svg>
