<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="水戸信用金庫スタジアムの駐車場を、予約制（akippa・有料と無料）と先着順（笠松運動公園付帯駐車場）の2種類に分け、東海村役場・イオン東海店屋上・那珂市役所・東海駅西口からの無料シャトルの所要時間を示したイバトコ作成の図版">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="1"/>

  <text x="80" y="96" font-family="'Source Sans 3', sans-serif" font-size="20" letter-spacing="2.4" fill="#a63f32">IBATOCO ・ 茨城ニュース解説</text>

  <text x="80" y="188" font-family="'Shippori Mincho', serif" font-size="52" font-weight="700" fill="#172b35">水戸信用金庫スタジアム</text>
  <text x="80" y="254" font-family="'Shippori Mincho', serif" font-size="52" font-weight="700" fill="#172b35">の駐車場</text>

  <line x1="80" y1="292" x2="300" y2="292" stroke="#a63f32" stroke-width="3"/>

  <g font-family="'Source Sans 3', sans-serif">
    <rect x="80" y="330" width="300" height="96" fill="#315c68"/>
    <text x="104" y="366" font-size="22" font-weight="700" fill="#ffffff">予約制（akippa）</text>
    <text x="104" y="398" font-size="18" fill="#e8eef0">有料の枠と、無料の枠</text>

    <rect x="404" y="330" width="300" height="96" fill="#ffffff" stroke="#315c68" stroke-width="2"/>
    <text x="428" y="366" font-size="22" font-weight="700" fill="#172b35">先着順</text>
    <text x="428" y="398" font-size="18" fill="#75695a">笠松運動公園 付帯駐車場</text>
  </g>

  <text x="80" y="470" font-family="'Source Sans 3', sans-serif" font-size="20" fill="#75695a">使える駐車場は、試合ごとに変わります</text>

  <g transform="translate(940,300)">
    <circle cx="0" cy="0" r="132" fill="none" stroke="#315c68" stroke-width="2.5" stroke-dasharray="7 7"/>
    <text x="0" y="-62" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#172b35">無料シャトル</text>
    <g font-family="'Source Sans 3', sans-serif" font-size="18" fill="#75695a">
      <text x="0" y="-22" text-anchor="middle">東海駅西口　約10分</text>
      <text x="0" y="8" text-anchor="middle">東海駅東口　約15分</text>
      <text x="0" y="38" text-anchor="middle">東海村役場　約15分</text>
      <text x="0" y="68" text-anchor="middle">那珂市役所　約20分</text>
    </g>
  </g>

  <text x="80" y="524" font-family="'Source Sans 3', sans-serif" font-size="21" fill="#315c68">帰りのシャトルは、全便が笠松運動公園「第4駐車場」発</text>

  <text x="80" y="578" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">出典：水戸ホーリーホック公式スタジアムガイドの公開情報（図版はイバトコ編集部作成）</text>
</svg>
