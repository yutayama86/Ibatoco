<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="大の里、十一月場所で優勝。13勝2敗、通算7度目。所属の二所ノ関部屋は茨城県阿見町。イバトコ作成の図版">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="1"/>
  <text x="80" y="96" font-family="'Source Sans 3', sans-serif" font-size="20" letter-spacing="2.4" fill="#a63f32">IBATOCO ・ 茨城ニュース解説</text>
  <text x="80" y="220" font-family="'Shippori Mincho', serif" font-size="72" font-weight="700" fill="#172b35">大の里 優勝</text>
  <text x="84" y="290" font-family="'Shippori Mincho', serif" font-size="40" font-weight="700" fill="#315c68">十一月場所 2026</text>
  <rect x="80" y="330" width="250" height="58" fill="#a63f32"/>
  <text x="205" y="369" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="28" font-weight="700" fill="#f6f2e9">13勝2敗</text>
  <rect x="348" y="330" width="330" height="58" fill="none" stroke="#315c68" stroke-width="2.5"/>
  <text x="513" y="369" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="26" font-weight="700" fill="#315c68">2場所連続・通算7度目</text>
  <text x="80" y="470" font-family="'Shippori Mincho', serif" font-size="32" font-weight="700" fill="#172b35">所属の二所ノ関部屋は茨城県阿見町</text>
  <text x="80" y="520" font-family="'Source Sans 3', sans-serif" font-size="22" fill="#75695a">茨城県が千秋楽の11月22日に知事談話を発表</text>
  <circle cx="820" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <circle cx="864" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <circle cx="908" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <circle cx="952" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <circle cx="996" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <circle cx="1040" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <circle cx="1084" cy="200" r="15" fill="#a63f32" stroke="#a63f32" stroke-width="2.5"/>
  <text x="952" y="250" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="18" fill="#75695a">幕内優勝 7回</text>
  <text x="1120" y="572" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a">出典：茨城県 ／ 図版：イバトコ</text>
